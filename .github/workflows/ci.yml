name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # The PR run already tested this exact tree -- strict status checks
      # require the branch to be current with the default branch before it can
      # merge -- so the post-merge run re-verifies content that just passed.
      # It still runs, to keep the CI badge and a real smoke signal on the
      # default branch, but the matrix collapses to one representative leg.
      matrix:
        rust: ${{ (github.event_name == 'push' && fromJSON('["stable"]')) || fromJSON('["stable","beta"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --lib --tests --examples
      - run: cargo test --all-features --doc
      # Benches are excluded above: `redis_comparison` needs a live Redis and
      # criterion targets are compiled, not asserted, in CI.
      - run: cargo check --all-features --benches

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # 1.85 covers the default build and the `middleware` feature.
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - run: cargo build --features middleware,observability,metrics-support
      # `tonic-support` pulls tonic/tonic-prost, which declare rust-version 1.88.
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo build --features tonic-support

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-features --lib --tests --examples -- -D warnings

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --no-verify --allow-dirty
      - name: report package size
        run: ls -lh target/package/*.crate

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
