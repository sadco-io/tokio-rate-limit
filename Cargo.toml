[package]
name = "tokio-rate-limit"
version = "0.6.0"
edition = "2021"
rust-version = "1.75.0"
authors = ["Daniel Curtis <drc@danielryancurtis.com>"]
description = "High-performance, lock-free rate limiting library with pluggable algorithms and Axum middleware"
license = "MIT OR Apache-2.0"
repository = "https://github.com/danielrcurtis/tokio-rate-limit"
documentation = "https://docs.rs/tokio-rate-limit"
keywords = ["rate-limit", "rate-limiting", "token-bucket", "axum", "middleware"]
categories = ["web-programming", "asynchronous", "network-programming"]
readme = "README.md"
exclude = ["ROADMAP.md", "benchmark_results.txt"]

[features]
default = []
middleware = ["axum", "tower"]
tonic-support = ["tonic", "tonic-prost", "tower", "http", "tonic-prost-build"]
observability = ["tracing"]
metrics-support = ["metrics", "observability"]

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["sync", "time"] }

# Concurrency primitives
parking_lot = "0.12"
flurry = "0.5"

# Optional: Axum middleware
axum = { version = "0.7", optional = true }
tower = { version = "0.5", optional = true }

# Optional: Tonic gRPC middleware
tonic = { version = "0.14.2", optional = true }
tonic-prost = { version = "0.14.2", optional = true }
http = { version = "1.3.1", optional = true }

# Optional: Observability
tracing = { version = "0.1.41", optional = true }
metrics = { version = "0.24.2", optional = true }

# Error handling
thiserror = "2.0.17"

# Utilities
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1.40", features = ["full", "test-util"] }
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
axum = "0.7"
tower = "0.5"
hyper = "1.7.0"
http-body-util = "0.1.3"
bytes = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# For observability example
tracing-subscriber = "0.3.20"

# For comparison benchmarks
governor = "0.10.1"
redis = { version = "0.32.7", features = ["tokio-comp", "connection-manager"] }

# Alternative concurrent hashmaps for testing
dashmap = "6.1"
papaya = "0.2.3"
scc = "3.3.5"

[build-dependencies]
tonic-prost-build = { version = "0.14.2", optional = true }

[[bench]]
name = "rate_limit_performance"
harness = false

[[bench]]
name = "comparison"
harness = false

[[bench]]
name = "shard_tuning"
harness = false

[[bench]]
name = "key_cardinality"
harness = false

[[bench]]
name = "redis_comparison"
harness = false

[[bench]]
name = "false_sharing_test"
harness = false

[[bench]]
name = "dashmap_alternatives"
harness = false

[[bench]]
name = "algorithm_comparison"
harness = false

[[bench]]
name = "v0_6_optimizations"
harness = false

[[bench]]
name = "tonic_middleware_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.bench]
lto = true
codegen-units = 1
opt-level = 3
