[workspace]
members = [".", "examples/grpc-hello"]
default-members = ["."]

[package]
name = "tokio-rate-limit"
version = "0.10.0"
edition = "2021"
# 1.85 is the floor for the default build and for `middleware`.
# The `tonic-support` feature additionally requires 1.88 -- tonic,
# tonic-prost and tonic-prost-build all declare rust-version = "1.88".
rust-version = "1.85"
authors = ["Daniel Curtis <drc@danielryancurtis.com>"]
description = "High-performance, lock-free rate limiting library with pluggable algorithms and Axum middleware"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sadco-io/tokio-rate-limit"
documentation = "https://docs.rs/tokio-rate-limit"
keywords = ["rate-limit", "rate-limiting", "token-bucket", "axum", "middleware"]
categories = ["web-programming", "asynchronous", "network-programming"]
readme = "README.md"
include = [
    "src/**/*.rs",
    "/README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[features]
default = []
middleware = ["axum", "tower"]
tonic-support = ["tonic", "tower", "http"]
observability = ["tracing"]
metrics-support = ["metrics", "observability"]

[dependencies]
# Async runtime
tokio = { version = "1.53", features = ["sync", "time"] }

# Concurrency primitives
flurry = "0.5.2"

# Optional: Axum middleware
axum = { version = "0.8.9", optional = true }
tower = { version = "0.5.3", optional = true }

# Optional: Tonic gRPC middleware
tonic = { version = "0.14.6", optional = true }
http = { version = "1.5", optional = true }

# Optional: Observability
tracing = { version = "0.1.44", optional = true }
metrics = { version = "0.24.6", optional = true }

# Error handling
thiserror = "2.0.20"

[dev-dependencies]
tokio = { version = "1.53", features = ["full", "test-util"] }
criterion = { version = "0.8", features = ["async_tokio", "html_reports"] }
axum = "0.8.9"
tower = "0.5"
hyper = "1.11"
http-body-util = "0.1.5"
bytes = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio-stream = "0.1.19"

# For observability example
tracing-subscriber = "0.3.23"

# For comparison benchmarks
governor = "0.10.4"
redis = { version = "1.6.0", features = ["tokio-comp", "connection-manager"] }

# Alternative concurrent hashmaps for testing
dashmap = "6.2"
papaya = "0.2.5"
scc = "3.8"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Examples and integration tests that need a non-default feature. Without
# these, `cargo test` / `cargo build --examples` fail because `middleware`
# / `tonic` are cfg-gated out of the library.

[[example]]
name = "axum_middleware"
required-features = ["middleware"]

[[example]]
name = "custom_key_extraction"
required-features = ["middleware"]

[[test]]
name = "tonic_integration"
required-features = ["tonic-support"]

[[bench]]
name = "rate_limit_performance"
harness = false

[[bench]]
name = "comparison"
harness = false

[[bench]]
name = "shard_tuning"
harness = false

[[bench]]
name = "key_cardinality"
harness = false

[[bench]]
name = "redis_comparison"
harness = false

[[bench]]
name = "false_sharing_test"
harness = false

[[bench]]
name = "dashmap_alternatives"
harness = false

[[bench]]
name = "algorithm_comparison"
harness = false

[[bench]]
name = "v0_6_optimizations"
harness = false

[[bench]]
name = "tonic_middleware_bench"
harness = false
required-features = ["tonic-support"]

[[bench]]
name = "probabilistic_comparison"
harness = false

[[bench]]
name = "probabilistic_tradeoff"
harness = false

[[bench]]
name = "component_breakdown"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.bench]
lto = true
codegen-units = 1
opt-level = 3
