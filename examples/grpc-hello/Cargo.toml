[package]
name = "grpc-hello"
version = "0.10.0"
edition = "2021"
publish = false

[[bin]]
name = "grpc-hello"
path = "src/server.rs"

[[bin]]
name = "grpc-hello-client"
path = "src/client.rs"

[dependencies]
tokio-rate-limit = { path = "../..", features = ["tonic-support"] }
tokio = { version = "1", features = ["full"] }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tower = "0.5"
tokio-stream = "0.1"

[build-dependencies]
tonic-prost-build = "0.14"
